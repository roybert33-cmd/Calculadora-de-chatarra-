  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0e0e10; color: #f4f4f5; }
    .safe-bottom { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-slide-up { animation: slideUp 0.3s ease-out; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- EL RESTO DE TU CÓDIGO REACT AQUÍ (App, materiales, etc...) -->

  <script type="text/babel">
    // ... (Tu código React que ya tienes) ...
  </script>

  <!-- ESTO FALTABA: Registro del Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrado', reg))
          .catch(err => console.log('Error al registrar SW', err));
      });
    }
  </script>
</body>
