<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora Chatarra - Deliverys Presss</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#facc15">
<link rel="apple-touch-icon" href="icon-512x512.png">
<style>
*{box-sizing:border-box;font-family:system-ui,Arial}
body{margin:0;background:#111827;color:#fff;padding:12px}
.card{background:#1f2937;border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid #374151}
h1{color:#facc15;text-align:center;margin:8px 0}
h2{color:#facc15;font-size:16px;margin:0 0 8px}
input{width:100%;padding:10px;border-radius:10px;border:1px solid #4b5563;background:#111827;color:#fff;margin:4px 0}
.row{display:flex;gap:8px;align-items:center}
.btn{background:#facc15;color:#111827;border:none;padding:12px;border-radius:12px;font-weight:800;width:100%;cursor:pointer;margin:6px 0}
.btn-outline{background:transparent;border:1px solid #facc15;color:#facc15}
.btn-green{background:#22c55e;color:#fff}
.total{font-size:28px;font-weight:900;color:#facc15;text-align:center}
.small{font-size:12px;color:#9ca3af}
.kpi{display:flex;justify-content:space-between;background:#111827;padding:8px 12px;border-radius:10px;margin:4px 0}
</style>
</head>
<body>
<h1>♻️ CHATARRA</h1>
<div class="card" style="border:2px solid #facc15">
<div class="total" id="hoyKpi">HOY: $0 | 0 Kg | 0 compras</div>
</div>
<div class="card">
<h2>👤 Datos Cliente</h2>
<input id="cNombre" placeholder="Nombre cliente">
<div class="row"><input id="cRut" placeholder="RUT" style="flex:1"><input id="cBanco" placeholder="Banco" style="flex:1"></div>
<input id="cCuenta" placeholder="N° Cuenta">
</div>
<div class="card">
<h2>⚙️ Config Jefe</h2>
<input id="jefeWsp" placeholder="+569XXXXXXXX">
<button class="btn btn-outline" onclick="guardarJefe()">Guardar N° Jefe</button>
<div class="small" id="jefeStatus"></div>
</div>
<div class="card">
<h2>📦 Materiales</h2>
<div id="lista"></div>
<button class="btn btn-outline" onclick="agregarMat()">+ Agregar material</button>
<div class="total" id="totalActual">Total: $0</div>
<button class="btn btn-green" onclick="guardarCompra()">💾 Guardar compra del día</button>
<button class="btn" onclick="enviarJefeIndividual()">📲 Enviar a Jefe</button>
</div>
<div class="card">
<h2>📊 Cierre Día</h2>
<div id="resumenDia"></div>
<button class="btn" style="background:#ef4444;color:#fff" onclick="cerrarDia()">🔴 GENERAR REPORTE Y REINICIAR A CERO</button>
<div id="detalleCierre"></div>
</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}
let materiales=[{n:'Fierro corto',p:120,k:0},{n:'Lata fierro',p:90,k:0},{n:'Aluminio',p:1000,k:0},{n:'Bronce',p:3500,k:0},{n:'Cobre',p:6000,k:0},{n:'Radiador de aluminio',p:550,k:0},{n:'Radiador mixto',p:2500,k:0}];
let comprasHoy=JSON.parse(localStorage.getItem('comprasHoy')||'[]');
function render(){let h='';materiales.forEach((m,i)=>{let sub=m.p*m.k;h+=`<div class="kpi"><div><b>${m.n}</b><br><span class="small">$${m.p} x kg</span></div><div style="text-align:right"><div class="row"><button onclick="materiales[${i}].k=Math.max(0,materiales[${i}].k-1);render()">-</button><input type="number" step="0.1" value="${m.k}" onchange="materiales[${i}].k=parseFloat(this.value)||0;render()" style="width:70px"><button onclick="materiales[${i}].k+=1;render()">+</button></div><div class="small">$${sub.toLocaleString()}</div></div></div>`});document.getElementById('lista').innerHTML=h;let total=materiales.reduce((a,b)=>a+b.p*b.k,0);document.getElementById('totalActual').innerText='Total: $'+total.toLocaleString('es-CL');let kg=0,plata=0;comprasHoy.forEach(c=>{c.detalle.forEach(d=>kg+=d.k);plata+=c.total});document.getElementById('hoyKpi').innerText=`HOY: $${plata.toLocaleString()} | ${kg.toFixed(1)} Kg | ${comprasHoy.length} compras`;}
function guardarCompra(){let det=materiales.filter(m=>m.k>0).map(m=>({n:m.n,k:m.k,p:m.p,sub:m.p*m.k}));if(!det.length)return alert('Agrega kilos');let total=det.reduce((a,b)=>a+b.sub,0);let compra={fecha:new Date().toLocaleString('es-CL'),cliente:{nombre:cNombre.value,rut:cRut.value,banco:cBanco.value,cuenta:cCuenta.value},detalle:det,total};comprasHoy.push(compra);localStorage.setItem('comprasHoy',JSON.stringify(comprasHoy));materiales.forEach(m=>m.k=0);render();alert('Guardada');}
function cerrarDia(){if(!comprasHoy.length)return alert('Sin compras');if(!confirm('¿Generar reporte y reiniciar a CERO?'))return;let jefe=localStorage.getItem('jefeWsp')||'';let plata=comprasHoy.reduce((a,b)=>a+b.total,0);let kg=0;comprasHoy.forEach(c=>c.detalle.forEach(d=>kg+=d.k));let txt=`*REPORTE DIARIO* ${new Date().toLocaleDateString()}%0A TOTAL: $${plata} - ${kg.toFixed(1)}Kg - ${comprasHoy.length} clientes%0A`;comprasHoy.forEach((c,i)=>{txt+=`${i+1}. ${c.cliente.nombre} ${c.cliente.rut} ${c.cliente.banco} ${c.cliente.cuenta} $${c.total}%0A`});if(jefe)window.open('https://wa.me/'+jefe.replace(/[^0-9]/g,'')+'?text='+txt,'_blank');comprasHoy=[];localStorage.setItem('comprasHoy','[]');render();}
function guardarJefe(){localStorage.setItem('jefeWsp',document.getElementById('jefeWsp').value);alert('Guardado')}
function agregarMat(){let n=prompt('Nombre');if(!n)return;let p=parseFloat(prompt('Precio')||'0');materiales.push({n,p,k:0});render();}
function enviarJefeIndividual(){let jefe=localStorage.getItem('jefeWsp');if(!jefe)return alert('Configura jefe');let det=materiales.filter(m=>m.k>0);if(!det.length)return alert('Sin kilos');let total=det.reduce((a,b)=>a+b.p*b.k,0);let txt=`Compra ${cNombre.value} $${total}`;window.open('https://wa.me/'+jefe.replace(/[^0-9]/g,'')+'?text='+txt,'_blank');}
render();
</script>
</body>
</html>
