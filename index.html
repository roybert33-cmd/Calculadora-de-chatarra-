<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Chatarra PRO - Gestión Total</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#facc15">
  <link rel="apple-touch-icon" href="icono-touch-de-apple.png">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0e0e10; color: #f4f4f5; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const MATERIALES_BASE = [
      { id: "cobre", name: "Cobre", shortName: "COBRE", price: 6500, color: "bg-orange-700", unit: "kg" },
      { id: "bronce", name: "Bronce", shortName: "BRONCE", price: 3800, color: "bg-amber-700", unit: "kg" },
      { id: "acero_inox", name: "Acero Inoxidable", shortName: "INOX", price: 800, color: "bg-blue-900", unit: "kg" },
      { id: "aluminio_l", name: "Aluminio Limpio", shortName: "ALU-L", price: 1100, color: "bg-slate-500", unit: "kg" },
      { id: "aluminio_s", name: "Aluminio Sucio", shortName: "ALU-S", price: 600, color: "bg-slate-700", unit: "kg" },
      { id: "rad_alu", name: "Radiador Aluminio", shortName: "R-ALU", price: 600, color: "bg-stone-500", unit: "kg" },
      { id: "rad_mix", name: "Radiador Mixto", shortName: "R-MIX", price: 2800, color: "bg-yellow-700", unit: "kg" },
      { id: "fierro_c", name: "Fierro Corto", shortName: "FIERRO", price: 130, color: "bg-zinc-700", unit: "kg" },
      { id: "lata", name: "Lata Fierro", shortName: "LATA", price: 90, color: "bg-zinc-600", unit: "kg" },
      { id: "motor", name: "Motor (Unidad)", shortName: "MOTOR", price: 12000, color: "bg-purple-900", unit: "un" },
      { id: "caja_v", name: "Caja Vehículo", shortName: "CAJA-V", price: 15000, color: "bg-gray-800", unit: "un" },
      { id: "bat_u", name: "Batería (Unidad)", shortName: "BAT-U", price: 15000, color: "bg-red-900", unit: "un" },
      { id: "bat_k", name: "Batería (Kilo)", shortName: "BAT-K", price: 850, color: "bg-zinc-800", unit: "kg" },
      { id: "calefon", name: "Calefón", shortName: "CALEF", price: 12000, color: "bg-amber-900", unit: "un" },
      { id: "catalitico", name: "Catalítico", shortName: "CATAL", price: 35000, color: "bg-amber-700", unit: "un" }
    ];

    const BANCOS = ["Banco Estado", "Santander", "BCI", "Chile", "Scotiabank", "Itaú", "Mach", "Tenpo", "Otro"];
    const TIPOS_CUENTA = ["Cuenta RUT", "Vista", "Corriente", "Ahorro"];

    function App() {
      const [materiales, setMateriales] = useState(MATERIALES_BASE);
      const [pesos, setPesos] = useState({});
      const [editandoPrecios, setEditandoPrecios] = useState(false);
      const [empresaNombre, setEmpresaNombre] = useState("COMPRA CHATARRA");
      const [whatsappJefe, setWhatsappJefe] = useState("");
      const [saldoCaja, setSaldoCaja] = useState(0); 
      const [comprasRealizadas, setComprasRealizadas] = useState([]); 
      const [metodoPago, setMetodoPago] = useState("efectivo");
      const [clienteForm, setClienteForm] = useState({ nombre: "", rut: "", banco: "Banco Estado", tipo: "Cuenta RUT", cuenta: "" });

      useEffect(() => {
        const load = (key, def) => localStorage.getItem(key) ? JSON.parse(localStorage.getItem(key)) : def;
        setSaldoCaja(Number(localStorage.getItem("saldo_caja_v8") || 0));
        setComprasRealizadas(load("compras_v8", []));
        setWhatsappJefe(localStorage.getItem("wa_jefe") || "");
        setMateriales(load("precios_v8", MATERIALES_BASE));
        setEmpresaNombre(localStorage.getItem("emp_nombre") || "COMPRA CHATARRA");
      }, []);

      useEffect(() => {
        localStorage.setItem("saldo_caja_v8", saldoCaja);
        localStorage.setItem("compras_v8", JSON.stringify(comprasRealizadas));
        localStorage.setItem("wa_jefe", whatsappJefe);
        localStorage.setItem("precios_v8", JSON.stringify(materiales));
        localStorage.setItem("emp_nombre", empresaNombre);
      }, [saldoCaja, comprasRealizadas, whatsappJefe, materiales, empresaNombre]);

      const formatearMoneda = (v) => new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 }).format(v || 0);

      const detalleVentaActual = useMemo(() => materiales.map(m => ({ 
        ...m, peso: parseFloat(pesos[m.id] || 0), subtotal: (pesos[m.id] || 0) * m.price 
      })), [materiales, pesos]);

      const totalCompraActual = detalleVentaActual.reduce((acc, curr) => acc + curr.subtotal, 0);
      const totalEfectivoHoy = comprasRealizadas.filter(c => c.metodo === "efectivo").reduce((acc, c) => acc + c.total, 0);
      const totalTransfHoy = comprasRealizadas.filter(c => c.metodo === "transferencia").reduce((acc, c) => acc + c.total, 0);
      const saldoDisponible = saldoCaja - totalEfectivoHoy;

      const inventarioAcumulado = useMemo(() => {
        const resumen = {};
        comprasRealizadas.forEach(c => c.detalle.forEach(item => {
          if (!resumen[item.id]) resumen[item.id] = { name: item.name, total: 0, unit: item.unit };
          resumen[item.id].total += item.peso;
        }));
        return Object.values(resumen);
      }, [comprasRealizadas]);

      const finalizarCompra = () => {
        if (totalCompraActual === 0) return;
        const nueva = { id: Date.now(), total: totalCompraActual, metodo: metodoPago, cliente: {...clienteForm}, detalle: detalleVentaActual.filter(m => m.peso > 0) };
        setComprasRealizadas([nueva, ...comprasRealizadas]);
        
        // Enviar Reporte de esta compra
        let txt = `*COMPRA - ${empresaNombre}*\n👤 ${clienteForm.nombre}\n🆔 ${clienteForm.rut}\n💰 *TOTAL:* ${formatearMoneda(totalCompraActual)}\n💳 *PAGO:* ${metodoPago.toUpperCase()}\n\n*DETALLE:*`;
        nueva.detalle.forEach(d => txt += `\n- ${d.name}: ${d.peso} ${d.unit}`);
        if(metodoPago === 'transferencia') txt += `\n\n*DATOS:* ${clienteForm.banco} | ${clienteForm.tipo} | ${clienteForm.cuenta}`;
        window.open(`https://wa.me/${whatsappJefe.replace(/\D/g, "")}?text=${encodeURIComponent(txt)}`, "_blank");

        setPesos({}); setClienteForm({ nombre: "", rut: "", banco: "Banco Estado", tipo: "Cuenta RUT", cuenta: "" });
      };

      const enviarReporteDiario = () => {
        let txt = `*RESUMEN DIARIO - ${empresaNombre}*\n━━━━━━━━━━━━━━\n💵 *EFECTIVO INICIAL:* ${formatearMoneda(saldoCaja)}\n📉 *GASTO EFECTIVO:* ${formatearMoneda(totalEfectivoHoy)}\n💳 *TOTAL TRANSFERENCIAS:* ${formatearMoneda(totalTransfHoy)}\n💰 *SALDO EN CAJA:* ${formatearMoneda(saldoDisponible)}\n\n*INVENTARIO COMPRADO:*`;
        inventarioAcumulado.forEach(i => txt += `\n📦 ${i.name}: ${i.total.toFixed(2)} ${i.unit}`);
        window.open(`https://wa.me/${whatsappJefe.replace(/\D/g, "")}?text=${encodeURIComponent(txt)}`, "_blank");
      };

      return (
        <div className="max-w-2xl mx-auto p-4 pb-48">
          <header className="flex items-center justify-between mb-4 bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
            <input value={empresaNombre} onChange={e => setEmpresaNombre(e.target.value.toUpperCase())} className="bg-transparent font-black text-xl text-yellow-400 outline-none w-full" />
            <button onClick={() => setEditandoPrecios(!editandoPrecios)} className={`px-4 py-2 rounded-xl text-[10px] font-black ${editandoPrecios ? 'bg-yellow-400 text-black' : 'bg-zinc-800 text-zinc-400'}`}>
              {editandoPrecios ? 'LISTO' : 'EDITAR $'}
            </button>
          </header>

          {/* Caja con Efectivo vs Transferencia */}
          <section className="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 mb-4 shadow-xl">
            <div className="flex justify-between items-center mb-4">
              <div>
                <p className="text-[10px] font-black text-zinc-500 uppercase tracking-widest">Saldo Real en Caja</p>
                <h1 className="text-3xl font-black text-green-400">{formatearMoneda(saldoDisponible)}</h1>
              </div>
              <button onClick={() => confirm("¿Reiniciar?") && (setComprasRealizadas([]), setSaldoCaja(0))} className="bg-zinc-800 p-2 rounded-lg"><i data-lucide="refresh-ccw" className="w-4 h-4"></i></button>
            </div>
            <div className="grid grid-cols-2 gap-2 text-[10px] font-bold">
               <div className="bg-black/40 p-2 rounded-xl border border-zinc-800">CARGAR CAJA: <input type="number" onBlur={e => setSaldoCaja(Number(e.target.value))} className="bg-transparent text-yellow-400 outline-none w-full text-lg font-black" /></div>
               <div className="bg-black/40 p-2 rounded-xl border border-zinc-800">TRANSF. HOY:<p className="text-lg font-black text-blue-400">{formatearMoneda(totalTransfHoy)}</p></div>
            </div>
          </section>

          {/* Datos Cliente Detallados */}
          <section className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 mb-4 space-y-2">
             <div className="flex gap-2 mb-2">
                <button onClick={() => setMetodoPago("efectivo")} className={`flex-1 py-2 rounded-xl text-[10px] font-black border ${metodoPago==='efectivo'?'bg-yellow-400 text-black border-yellow-400':'bg-zinc-800 text-zinc-500 border-zinc-700'}`}>EFECTIVO</button>
                <button onClick={() => setMetodoPago("transferencia")} className={`flex-1 py-2 rounded-xl text-[10px] font-black border ${metodoPago==='transferencia'?'bg-blue-500 text-white border-blue-500':'bg-zinc-800 text-zinc-500 border-zinc-700'}`}>TRANSFERENCIA</button>
             </div>
             <input placeholder="Nombre Cliente" value={clienteForm.nombre} onChange={e => setClienteForm({...clienteForm, nombre: e.target.value})} className="w-full bg-black border border-zinc-800 p-3 rounded-xl text-xs outline-none" />
             <input placeholder="RUT" value={clienteForm.rut} onChange={e => setClienteForm({...clienteForm, rut: e.target.value})} className="w-full bg-black border border-zinc-800 p-3 rounded-xl text-xs outline-none" />
             {metodoPago === 'transferencia' && (
               <div className="grid grid-cols-2 gap-2 animate-slide-up">
                  <select onChange={e => setClienteForm({...clienteForm, banco: e.target.value})} className="bg-black border border-zinc-800 p-3 rounded-xl text-xs outline-none">
                    {BANCOS.map(b => <option key={b}>{b}</option>)}
                  </select>
                  <select onChange={e => setClienteForm({...clienteForm, tipo: e.target.value})} className="bg-black border border-zinc-800 p-3 rounded-xl text-xs outline-none">
                    {TIPOS_CUENTA.map(t => <option key={t}>{t}</option>)}
                  </select>
                  <input placeholder="Nº Cuenta" onChange={e => setClienteForm({...clienteForm, cuenta: e.target.value})} className="col-span-2 bg-black border border-zinc-800 p-3 rounded-xl text-xs outline-none" />
               </div>
             )}
          </section>

          {/* Lista Materiales */}
          <div className="space-y-2 mb-4">
            {materiales.map(m => (
              <div key={m.id} className={`p-4 rounded-2xl border transition-all ${pesos[m.id] > 0 ? 'bg-zinc-800 border-yellow-400' : 'bg-zinc-900 border-zinc-800'}`}>
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className={`w-10 h-10 rounded-xl ${m.color} flex items-center justify-center font-black text-[9px] text-white uppercase`}>{m.shortName}</div>
                    <div>
                      <h4 className="font-bold text-xs">{m.name}</h4>
                      {editandoPrecios ? <input type="number" value={m.price} onChange={e => setMateriales(prev => prev.map(x => x.id === m.id ? {...x, price: Number(e.target.value)} : x))} className="bg-black text-yellow-400 text-xs font-bold w-16 p-1 rounded" /> : <p className="text-[10px] text-zinc-500 font-bold">{formatearMoneda(m.price)} / {m.unit}</p>}
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => setPesos({...pesos, [m.id]: Math.max(0, (pesos[m.id] || 0) - (m.unit === 'un' ? 1 : 0.5))})} className="w-8 h-8 rounded-full bg-zinc-700 text-white font-black">-{m.unit === 'un'?'1':'0.5'}</button>
                    <input type="text" inputMode="decimal" value={pesos[m.id] || ""} onChange={e => setPesos({...pesos, [m.id]: e.target.value.replace(",",".")})} className="bg-black border border-zinc-700 w-14 py-2 rounded-xl text-center font-black text-sm outline-none" />
                    <button onClick={() => setPesos({...pesos, [m.id]: (pesos[m.id] || 0) + (m.unit === 'un' ? 1 : 0.5)})} className="w-8 h-8 rounded-full bg-yellow-400 text-black font-black">+{m.unit === 'un'?'1':'0.5'}</button>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {/* Configuración Reportes */}
          <section className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 mb-4">
             <input placeholder="WhatsApp Jefe (569...)" value={whatsappJefe} onChange={e => setWhatsappJefe(e.target.value)} className="w-full bg-black border border-zinc-800 p-3 rounded-xl text-xs outline-none text-green-400 font-bold" />
             <button onClick={enviarReporteDiario} className="w-full mt-3 bg-zinc-800 py-3 rounded-xl text-[10px] font-black tracking-widest flex items-center justify-center gap-2">
                <i data-lucide="file-text" className="w-4 h-4"></i> ENVIAR REPORTE DEL DÍA AL JEFE
             </button>
          </section>

          {/* Botón Flotante */}
          <div className="fixed bottom-0 left-0 right-0 p-4 bg-black/90 backdrop-blur-xl border-t border-zinc-800 z-50">
            <div className="max-w-2xl mx-auto flex items-center gap-4">
              <div className="flex-1">
                <p className="text-[9px] font-black text-zinc-500 uppercase">Pago {metodoPago === 'efectivo' ? 'en Efectivo' : 'por Transferencia'}</p>
                <h2 className={`text-2xl font-black ${metodoPago === 'efectivo' ? 'text-white' : 'text-blue-400'}`}>{formatearMoneda(totalCompraActual)}</h2>
              </div>
              <button onClick={finalizarCompra} disabled={totalCompraActual === 0} className={`px-8 py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest transition shadow-lg ${metodoPago === 'efectivo' ? 'bg-yellow-400 text-black shadow-yellow-500/10' : 'bg-blue-500 text-white shadow-blue-500/10'}`}>
                FINALIZAR Y ENVIAR
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 500);
  </script>
</body>
</html>
