<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Chatarra PRO - Inteligente</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#facc15">
  <link rel="apple-touch-icon" href="icono-touch-de-apple.png">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0e0e10; color: #f4f4f5; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const MATERIALES_BASE = [
      { id: "cobre", name: "Cobre", shortName: "COBRE", price: 6500, color: "bg-orange-700", unit: "kg" },
      { id: "bronce", name: "Bronce", shortName: "BRONCE", price: 3800, color: "bg-amber-700", unit: "kg" },
      { id: "acero_inox", name: "Acero Inoxidable", shortName: "INOX", price: 800, color: "bg-blue-900", unit: "kg" },
      { id: "aluminio_l", name: "Aluminio Limpio", shortName: "ALU-L", price: 1100, color: "bg-slate-500", unit: "kg" },
      { id: "aluminio_s", name: "Aluminio Sucio", shortName: "ALU-S", price: 600, color: "bg-slate-700", unit: "kg" },
      { id: "rad_alu", name: "Radiador Aluminio", shortName: "R-ALU", price: 600, color: "bg-stone-500", unit: "kg" },
      { id: "rad_mix", name: "Radiador Mixto", shortName: "R-MIX", price: 2800, color: "bg-yellow-700", unit: "kg" },
      { id: "fierro_c", name: "Fierro Corto", shortName: "FIERRO", price: 130, color: "bg-zinc-700", unit: "kg" },
      { id: "lata", name: "Lata Fierro", shortName: "LATA", price: 90, color: "bg-zinc-600", unit: "kg" },
      { id: "motor", name: "Motor (Unidad)", shortName: "MOTOR", price: 12000, color: "bg-purple-900", unit: "un" },
      { id: "caja_v", name: "Caja Vehículo", shortName: "CAJA-V", price: 15000, color: "bg-gray-800", unit: "un" },
      { id: "bat_u", name: "Batería (Unidad)", shortName: "BAT-U", price: 15000, color: "bg-red-900", unit: "un" },
      { id: "bat_k", name: "Batería (Kilo)", shortName: "BAT-K", price: 850, color: "bg-zinc-800", unit: "kg" },
      { id: "calefon", name: "Calefón", shortName: "CALEF", price: 12000, color: "bg-amber-900", unit: "un" },
      { id: "catalitico", name: "Catalítico", shortName: "CATAL", price: 35000, color: "bg-amber-700", unit: "un" }
    ];

    function App() {
      const [materiales, setMateriales] = useState(MATERIALES_BASE);
      const [pesos, setPesos] = useState({});
      const [editandoPrecios, setEditandoPrecios] = useState(false);
      const [empresaNombre, setEmpresaNombre] = useState("COMPRA CHATARRA");
      const [whatsappJefe, setWhatsappJefe] = useState("");
      const [clienteForm, setClienteForm] = useState({ nombre: "", rut: "", cuenta: "", banco: "Cuenta RUT" });
      const [saldoCaja, setSaldoCaja] = useState(0); 
      const [comprasRealizadas, setComprasRealizadas] = useState([]); 

      useEffect(() => {
        const storedCaja = localStorage.getItem("app_saldo_caja_v6");
        if (storedCaja) setSaldoCaja(parseFloat(storedCaja));
        const storedHistory = localStorage.getItem("app_historial_compras_v6");
        if (storedHistory) setComprasRealizadas(JSON.parse(storedHistory));
        const storedWA = localStorage.getItem("app_whatsapp_jefe");
        if (storedWA) setWhatsappJefe(storedWA);
        const storedPrices = localStorage.getItem("app_precios_v6");
        if (storedPrices) setMateriales(JSON.parse(storedPrices));
      }, []);

      useEffect(() => localStorage.setItem("app_saldo_caja_v6", saldoCaja), [saldoCaja]);
      useEffect(() => localStorage.setItem("app_historial_compras_v6", JSON.stringify(comprasRealizadas)), [comprasRealizadas]);
      useEffect(() => localStorage.setItem("app_whatsapp_jefe", whatsappJefe), [whatsappJefe]);
      useEffect(() => localStorage.setItem("app_precios_v6", JSON.stringify(materiales)), [materiales]);

      const formatearMoneda = (v) => new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 }).format(v || 0);

      const detalleVentaActual = useMemo(() => materiales.map(m => ({ 
        ...m, 
        peso: parseFloat(pesos[m.id] || 0), 
        subtotal: parseFloat((pesos[m.id] || 0) * m.price) 
      })), [materiales, pesos]);

      const totalCompraActual = detalleVentaActual.reduce((acc, curr) => acc + curr.subtotal, 0);

      const inventarioAcumulado = useMemo(() => {
        const resumen = {};
        comprasRealizadas.forEach(compra => {
          compra.detalle.forEach(item => {
            if (!resumen[item.id]) resumen[item.id] = { name: item.name, totalPeso: 0, unit: item.unit };
            resumen[item.id].totalPeso += parseFloat(item.peso);
          });
        });
        return Object.values(resumen);
      }, [comprasRealizadas]);

      const totalGastadoDia = comprasRealizadas.reduce((acc, c) => acc + c.total, 0);
      const saldoDisponible = saldoCaja - totalGastadoDia;

      const finalizarCompra = () => {
        if (totalCompraActual === 0) return;
        setComprasRealizadas([{ id: Date.now(), total: totalCompraActual, detalle: detalleVentaActual.filter(m => m.peso > 0) }, ...comprasRealizadas]);
        setPesos({});
        setClienteForm({ nombre: "", rut: "", cuenta: "", banco: "Cuenta RUT" });
        alert("✅ Compra Guardada");
      };

      return (
        <div className="max-w-2xl mx-auto p-4 pb-48">
          {/* Caja con precisión de pesos */}
          <section className="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 mb-6 shadow-2xl">
            <div className="flex justify-between items-start mb-4">
              <div>
                <p className="text-[10px] font-black text-zinc-500 uppercase tracking-widest">Efectivo en Caja</p>
                <h1 className={`text-3xl font-black ${saldoDisponible < 0 ? 'text-red-500' : 'text-green-400'}`}>
                  {formatearMoneda(saldoDisponible)}
                </h1>
              </div>
              <button onClick={() => {if(confirm("¿Reiniciar todo?")){setComprasRealizadas([]);setSaldoCaja(0);}}} className="bg-zinc-800 p-2 rounded-lg text-zinc-500"><i data-lucide="refresh-ccw" className="w-4 h-4"></i></button>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <input type="number" placeholder="Cargar Efectivo" onChange={(e) => setSaldoCaja(parseFloat(e.target.value) || 0)} className="w-full bg-black border border-zinc-800 p-3 rounded-xl text-sm font-black text-yellow-400 outline-none" />
              <div className="p-3 text-sm font-black text-white bg-black/30 rounded-xl border border-zinc-800/50">Gasto Hoy: {formatearMoneda(totalGastadoDia)}</div>
            </div>
          </section>

          {/* Lista de Materiales - Lógica de Unidad vs Kilos */}
          <div className="space-y-2 mb-8">
            {materiales.map(m => (
              <div key={m.id} className={`p-4 rounded-2xl border transition-all ${pesos[m.id] > 0 ? 'bg-zinc-800 border-yellow-400' : 'bg-zinc-900 border-zinc-800'}`}>
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className={`w-10 h-10 rounded-xl ${m.color} flex items-center justify-center font-black text-[9px] text-white uppercase`}>{m.shortName}</div>
                    <div>
                      <h4 className="font-bold text-xs">{m.name}</h4>
                      <p className="text-[10px] text-zinc-500 font-bold">{formatearMoneda(m.price)} / {m.unit}</p>
                    </div>
                  </div>
                  
                  <div className="flex items-center gap-2">
                    {/* Botón menos: 1 para unidad, 0.5 para kilo */}
                    <button 
                      onClick={() => setPesos({...pesos, [m.id]: Math.max(0, (pesos[m.id] || 0) - (m.unit === 'un' ? 1 : 0.5))})}
                      className="w-8 h-8 rounded-full bg-zinc-700 text-white font-black"
                    >
                      -{m.unit === 'un' ? '1' : '0.5'}
                    </button>
                    
                    <input 
                      type="text" 
                      inputMode="decimal"
                      value={pesos[m.id] || ""} 
                      onChange={e => {
                        const val = e.target.value.replace(",", ".");
                        if (m.unit === 'un') {
                           setPesos({...pesos, [m.id]: parseInt(val) || 0});
                        } else {
                           setPesos({...pesos, [m.id]: val});
                        }
                      }}
                      onBlur={e => {
                        const val = parseFloat(e.target.value);
                        setPesos({...pesos, [m.id]: isNaN(val) ? 0 : val});
                      }}
                      placeholder="0"
                      className="bg-black border border-zinc-700 w-16 py-2 rounded-xl text-center font-black text-sm outline-none"
                    />

                    {/* Botón más: 1 para unidad, 0.5 para kilo */}
                    <button 
                      onClick={() => setPesos({...pesos, [m.id]: (pesos[m.id] || 0) + (m.unit === 'un' ? 1 : 0.5)})}
                      className="w-8 h-8 rounded-full bg-yellow-400 text-black font-black"
                    >
                      +{m.unit === 'un' ? '1' : '0.5'}
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {/* Inventario con formato inteligente */}
          {inventarioAcumulado.length > 0 && (
            <section className="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 mb-12">
               <h3 className="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-4">Inventario Hoy</h3>
               <div className="grid grid-cols-1 gap-2">
                  {inventarioAcumulado.map(item => (
                    <div key={item.name} className="flex justify-between items-center bg-black/40 p-3 rounded-xl border border-zinc-800">
                       <span className="text-xs font-bold text-zinc-400">{item.name}</span>
                       <span className="text-sm font-black text-yellow-400">
                        {item.unit === 'un' ? Math.round(item.totalPeso) : item.totalPeso.toFixed(2).replace(".", ",")} {item.unit}
                       </span>
                    </div>
                  ))}
               </div>
            </section>
          )}

          {/* Footer Fijo */}
          <div className="fixed bottom-0 left-0 right-0 p-4 bg-black/95 backdrop-blur-xl border-t border-zinc-800 z-50">
            <div className="max-w-2xl mx-auto flex items-center gap-4">
              <div className="flex-1">
                <p className="text-[9px] font-black text-zinc-500 uppercase">Pago Actual</p>
                <h2 className="text-2xl font-black text-white">{formatearMoneda(totalCompraActual)}</h2>
              </div>
              <button onClick={finalizarCompra} disabled={totalCompraActual === 0} className="bg-yellow-400 disabled:bg-zinc-800 text-black px-8 py-4 rounded-2xl font-black text-xs uppercase">Pagar Compra</button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 500);
  </script>
</body>
</html>
