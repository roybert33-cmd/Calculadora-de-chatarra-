<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Calculadora de Chatarra PRO</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0e0e10; color: #f4f4f5; }
    .safe-bottom { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-slide-up { animation: slideUp 0.3s ease-out; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- CONFIGURACIÓN INICIAL ---
    const MATERIALES_BASE = [
      { id: "fierro_corto", name: "Fierro Corto", shortName: "FIERRO", price: 120, color: "bg-zinc-700", desc: "Fierro limpio, corto", unit: "kg" },
      { id: "lata_fierro", name: "Lata Fierro", shortName: "LATA", price: 90, color: "bg-zinc-600", desc: "Tarros, latas prensadas", unit: "kg" },
      { id: "aluminio", name: "Aluminio", shortName: "ALUM", price: 1000, color: "bg-slate-500", desc: "Blando, perfiles, latas", unit: "kg" },
      { id: "bronce", name: "Bronce", shortName: "BRONCE", price: 3500, color: "bg-amber-700", desc: "Llaves, válvulas, bujes", unit: "kg" },
      { id: "cobre", name: "Cobre", shortName: "COBRE", price: 6000, color: "bg-orange-700", desc: "Cable pelado, cañería", unit: "kg" },
      { id: "rad_aluminio", name: "Radiador de Aluminio", shortName: "RAD-ALU", price: 550, color: "bg-stone-500", desc: "Radiador auto, limpio", unit: "kg" },
      { id: "rad_mixto", name: "Radiador Mixto", shortName: "RAD-MIX", price: 2500, color: "bg-yellow-700", desc: "Cobre + aluminio", unit: "kg" },
      { id: "bateria_unidad", name: "Batería Vehículo (Unidad)", shortName: "BAT-UN", price: 15000, color: "bg-red-900", desc: "Precio por unidad", unit: "un" },
      { id: "bateria_kilo", name: "Batería Vehículo (Kilo)", shortName: "BAT-KG", price: 800, color: "bg-zinc-800", desc: "Precio por kilo", unit: "kg" },
      { id: "calefon_unidad", name: "Calefón (Unidad)", shortName: "CAL-UN", price: 10000, color: "bg-amber-900", desc: "Precio por unidad", unit: "un" },
      { id: "catalitico_unidad", name: "Catalítico (Unidad)", shortName: "CAT-UN", price: 25000, color: "bg-amber-700", desc: "Precio por unidad", unit: "un" }
    ];

    const BANCOS = ["Banco Estado", "Cuenta RUT", "Banco Santander", "Banco BCI", "Banco de Chile", "Scotiabank", "Itaú", "Mach", "Tenpo", "Otro"];
    const TIPOS_CUENTA = ["Cuenta RUT", "Cuenta Vista", "Cuenta Corriente", "Cuenta Ahorro", "Otro"];

    function App() {
      // --- ESTADOS ---
      const [materiales, setMateriales] = useState(MATERIALES_BASE);
      const [pesos, setPesos] = useState({});
      const [editandoPrecios, setEditandoPrecios] = useState(false);
      const [empresaNombre, setEmpresaNombre] = useState("MI NEGOCIO");
      const [whatsappJefe, setWhatsappJefe] = useState("");
      const [clientes, setClientes] = useState([]);
      const [busquedaCliente, setBusquedaCliente] = useState("");
      const [mostrarClientes, setMostrarClientes] = useState(false);
      const [mensajeStatus, setMensajeStatus] = useState("");
      
      const [clienteForm, setClienteForm] = useState({
        nombre: "", rut: "", cuenta: "", banco: "Banco Estado", tipoCuenta: "Cuenta RUT"
      });

      // --- PERSISTENCIA (Segura) ---
      useEffect(() => {
        const storedName = localStorage.getItem("app_empresa_nombre");
        if (storedName) setEmpresaNombre(storedName);

        const storedWA = localStorage.getItem("app_whatsapp_jefe");
        if (storedWA) setWhatsappJefe(storedWA);

        try {
          const storedClients = localStorage.getItem("app_clientes_v2");
          if (storedClients) {
            const parsed = JSON.parse(storedClients);
            if (Array.isArray(parsed)) setClientes(parsed);
          }
        } catch (e) {
          console.error("Error cargando clientes:", e);
          setClientes([]);
        }
      }, []);

      useEffect(() => {
        localStorage.setItem("app_empresa_nombre", empresaNombre);
      }, [empresaNombre]);

      useEffect(() => {
        localStorage.setItem("app_whatsapp_jefe", whatsappJefe);
      }, [whatsappJefe]);

      useEffect(() => {
        localStorage.setItem("app_clientes_v2", JSON.stringify(clientes));
      }, [clientes]);

      // --- CALCULOS (Con protección NaN) ---
      const formatearMoneda = (valor) => {
        if (isNaN(valor) || valor === null) return "$0";
        return new Intl.NumberFormat("es-CL", {
          style: "currency",
          currency: "CLP",
          maximumFractionDigits: 0
        }).format(Math.round(valor));
      };

      const formatearNumero = (val) => {
        if (!val) return "0";
        return val.toString().replace(".", ",");
      };

      const detalleVenta = useMemo(() => {
        return materiales.map(m => {
          const peso = pesos[m.id] || 0;
          return { ...m, peso, subtotal: peso * m.price };
        });
      }, [materiales, pesos]);

      const totalKilos = useMemo(() => detalleVenta.reduce((acc, curr) => acc + curr.peso, 0), [detalleVenta]);
      const totalPagar = useMemo(() => detalleVenta.reduce((acc, curr) => acc + curr.subtotal, 0), [detalleVenta]);
      const materialesConPeso = useMemo(() => detalleVenta.filter(m => m.peso > 0), [detalleVenta]);

      // --- HANDLERS ---
      const ajustarPeso = (id, cant) => {
        setPesos(prev => {
          const actual = prev[id] || 0;
          const nuevo = Math.max(0, parseFloat((actual + cant).toFixed(2)));
          return { ...prev, [id]: nuevo };
        });
      };

      const manualPeso = (id, valor) => {
        const num = parseFloat(valor.replace(",", "."));
        setPesos(prev => ({ ...prev, [id]: isNaN(num) ? 0 : num }));
      };

      const editarPrecio = (id, nuevoPrecio) => {
        setMateriales(prev => prev.map(m => m.id === id ? { ...m, price: Number(nuevoPrecio) } : m));
      };

      const guardarCliente = () => {
        if (!clienteForm.nombre || !clienteForm.rut) {
          showStatus("⚠️ Falta Nombre o RUT");
          return;
        }
        const index = clientes.findIndex(c => c.rut === clienteForm.rut);
        if (index > -1) {
          const nuevos = [...clientes];
          nuevos[index] = { ...clienteForm, id: clientes[index].id };
          setClientes(nuevos);
          showStatus("✅ Cliente Actualizado");
        } else {
          setClientes([{ ...clienteForm, id: Date.now() }, ...clientes]);
          showStatus("✅ Cliente Guardado");
        }
      };

      const seleccionarCliente = (c) => {
        setClienteForm(c);
        setMostrarClientes(false);
        showStatus("👤 Cliente seleccionado");
      };

      const eliminarCliente = (id) => {
        setClientes(clientes.filter(c => c.id !== id));
      };

      const showStatus = (msg) => {
        setMensajeStatus(msg);
        setTimeout(() => setMensajeStatus(""), 3000);
      };

      // --- REPORTES ---
      const generarReporteText = () => {
        const fecha = new Date().toLocaleString("es-CL");
        let txt = `*REPORTE DE PAGO - ${empresaNombre.toUpperCase()}*\n`;
        txt += `📅 ${fecha}\n`;
        txt += `━━━━━━━━━━━━━━━━━━━━\n`;
        txt += `👤 *CLIENTE:* ${clienteForm.nombre || "No especificado"}\n`;
        txt += `🆔 *RUT:* ${clienteForm.rut || "No especificado"}\n\n`;
        txt += `📦 *DETALLE:* \n`;
        materialesConPeso.forEach(m => {
          txt += `- ${m.name}: ${formatearNumero(m.peso)} ${m.unit} x ${formatearMoneda(m.price)} = ${formatearMoneda(m.subtotal)}\n`;
        });
        txt += `\n💰 *TOTAL A TRANSFERIR:* ${formatearMoneda(totalPagar)}\n`;
        txt += `━━━━━━━━━━━━━━━━━━━━\n`;
        txt += `🏦 *DATOS TRANSFERENCIA:*\n`;
        txt += `${clienteForm.banco} | ${clienteForm.tipoCuenta}\n`;
        txt += `Nº: ${clienteForm.cuenta}\n`;
        txt += `━━━━━━━━━━━━━━━━━━━━`;
        return txt;
      };

      const enviarWhatsApp = () => {
        if (!whatsappJefe) {
          alert("Por favor, configura el número del jefe primero.");
          return;
        }
        const cleanNumber = whatsappJefe.replace(/\D/g, "");
        const url = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(generarReporteText())}`;
        window.open(url, "_blank");
      };

      // --- FILTRO SEGURO ---
      const clientesFiltrados = clientes.filter(c => {
        const query = busquedaCliente.toLowerCase();
        // Protección contra campos nulos o indefinidos
        const nombre = (c.nombre || "").toLowerCase();
        const rut = (c.rut || "").toLowerCase();
        return nombre.includes(query) || rut.includes(query);
      });

      return (
        <div className="max-w-2xl mx-auto p-4 pb-32">
          {/* Header */}
          <header className="flex items-center justify-between mb-6 bg-zinc-900 p-4 rounded-2xl border border-zinc-800 shadow-lg">
            <div>
              <input 
                value={empresaNombre} 
                onChange={e => setEmpresaNombre(e.target.value.toUpperCase())}
                className="bg-transparent font-black text-xl text-yellow-400 outline-none w-full"
                placeholder="NOMBRE EMPRESA"
              />
              <p className="text-xs text-zinc-500 font-bold tracking-widest uppercase">Calculadora de Compra</p>
            </div>
            <button 
              onClick={() => setEditandoPrecios(!editandoPrecios)}
              className={`px-4 py-2 rounded-xl text-xs font-bold transition ${editandoPrecios ? 'bg-yellow-400 text-black' : 'bg-zinc-800 text-zinc-400'}`}
            >
              {editandoPrecios ? 'LISTO' : 'EDITAR $'}
            </button>
          </header>

          {/* Sección Clientes */}
          <section className="mb-6 bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden">
            <div className="p-4 border-b border-zinc-800 flex justify-between items-center">
              <h3 className="text-xs font-black text-zinc-400 tracking-tighter uppercase">Datos del Cliente</h3>
              {mensajeStatus && <span className="text-[10px] font-black text-yellow-400 animate-pulse">{mensajeStatus}</span>}
            </div>
            
            <div className="p-4 space-y-3">
              <div className="relative">
                <button 
                  onClick={() => setMostrarClientes(!mostrarClientes)}
                  className="w-full bg-black border border-zinc-800 p-3 rounded-xl text-left text-sm flex justify-between items-center"
                >
                  <span className={clienteForm.nombre ? "text-white font-bold" : "text-zinc-600"}>
                    {clienteForm.nombre || "Seleccionar Cliente Guardado..."}
                  </span>
                  <i data-lucide="chevron-down" className="w-4 h-4 text-zinc-500"></i>
                </button>
                
                {mostrarClientes && (
                  <div className="absolute z-50 mt-2 w-full bg-zinc-800 border border-zinc-700 rounded-xl shadow-2xl p-2 animate-slide-up">
                    <input 
                      placeholder="Buscar por nombre o RUT..."
                      className="w-full bg-black border border-zinc-700 p-2 rounded-lg text-sm mb-2 outline-none focus:border-yellow-400"
                      value={busquedaCliente}
                      onChange={e => setBusquedaCliente(e.target.value)}
                    />
                    <div className="max-h-48 overflow-y-auto">
                      {clientesFiltrados.length > 0 ? clientesFiltrados.map(c => (
                        <div key={c.id} className="flex items-center justify-between p-2 hover:bg-zinc-700 rounded-lg cursor-pointer transition">
                          <div className="flex-1" onClick={() => seleccionarCliente(c)}>
                            <p className="text-sm font-bold">{c.nombre}</p>
                            <p className="text-[10px] text-zinc-400">{c.rut} • {c.banco}</p>
                          </div>
                          <button onClick={() => eliminarCliente(c.id)} className="p-1 text-zinc-500 hover:text-red-400">
                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                          </button>
                        </div>
                      )) : <p className="text-center py-4 text-zinc-500 text-xs">No se encontraron clientes</p>}
                    </div>
                  </div>
                )}
              </div>

              <div className="grid grid-cols-2 gap-2">
                <input 
                  placeholder="Nombre Apellido"
                  value={clienteForm.nombre}
                  onChange={e => setClienteForm({...clienteForm, nombre: e.target.value})}
                  className="bg-black border border-zinc-800 p-3 rounded-xl text-sm outline-none focus:border-yellow-400"
                />
                <input 
                  placeholder="RUT"
                  value={clienteForm.rut}
                  onChange={e => setClienteForm({...clienteForm, rut: e.target.value})}
                  className="bg-black border border-zinc-800 p-3 rounded-xl text-sm outline-none focus:border-yellow-400"
                />
                <input 
                  placeholder="Nº Cuenta"
                  value={clienteForm.cuenta}
                  onChange={e => setClienteForm({...clienteForm, cuenta: e.target.value})}
                  className="bg-black border border-zinc-800 p-3 rounded-xl text-sm outline-none focus:border-yellow-400"
                />
                <select 
                  value={clienteForm.banco}
                  onChange={e => setClienteForm({...clienteForm, banco: e.target.value})}
                  className="bg-black border border-zinc-800 p-3 rounded-xl text-sm outline-none focus:border-yellow-400"
                >
                  {BANCOS.map(b => <option key={b} value={b}>{b}</option>)}
                </select>
              </div>
              <button 
                onClick={guardarCliente}
                className="w-full bg-zinc-800 hover:bg-zinc-700 text-white py-2 rounded-xl text-xs font-black tracking-widest transition"
              >
                GUARDAR / ACTUALIZAR CLIENTE
              </button>
            </div>
          </section>

          {/* Lista de Materiales */}
          <div className="space-y-3">
            {materiales.map(m => (
              <div key={m.id} className={`p-4 rounded-2xl border transition-all ${pesos[m.id] > 0 ? 'bg-zinc-800 border-yellow-400/50 shadow-lg shadow-yellow-400/5' : 'bg-zinc-900 border-zinc-800 opacity-80'}`}>
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-3">
                    <div className={`w-10 h-10 rounded-xl ${m.color} flex items-center justify-center font-black text-xs`}>
                      {m.shortName}
                    </div>
                    <div>
                      <h4 className="font-bold text-sm">{m.name}</h4>
                      {editandoPrecios ? (
                        <div className="flex items-center gap-1 mt-1">
                          <span className="text-yellow-400 text-xs font-bold">$</span>
                          <input 
                            type="number"
                            value={m.price}
                            onChange={e => editarPrecio(m.id, e.target.value)}
                            className="bg-black border border-zinc-700 w-20 px-2 py-0.5 rounded text-xs font-bold text-yellow-400"
                          />
                        </div>
                      ) : (
                        <p className="text-xs text-zinc-500 font-bold">{formatearMoneda(m.price)} / {m.unit}</p>
                      )}
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => ajustarPeso(m.id, -1)}
                      className="w-8 h-8 rounded-full bg-zinc-700 flex items-center justify-center active:scale-90 transition disabled:opacity-20"
                      disabled={!pesos[m.id]}
                    >
                      <i data-lucide="minus" className="w-4 h-4"></i>
                    </button>
                    <div className="relative">
                      <input 
                        type="text"
                        inputMode="decimal"
                        value={pesos[m.id] === undefined || pesos[m.id] === 0 ? "" : formatearNumero(pesos[m.id])}
                        onChange={e => manualPeso(m.id, e.target.value)}
                        placeholder="0"
                        className="bg-black border border-zinc-700 w-20 py-2 rounded-xl text-center font-black text-sm outline-none focus:border-yellow-400"
                      />
                    </div>
                    <button 
                      onClick={() => ajustarPeso(m.id, 1)}
                      className="w-8 h-8 rounded-full bg-yellow-400 text-black flex items-center justify-center active:scale-90 transition shadow-lg shadow-yellow-400/20"
                    >
                      <i data-lucide="plus" className="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
                {pesos[m.id] > 0 && (
                  <div className="flex justify-between items-center pt-2 border-t border-zinc-700/50">
                    <span className="text-[10px] font-black text-zinc-500 uppercase tracking-widest">Subtotal</span>
                    <span className="text-sm font-black text-yellow-400">{formatearMoneda(m.subtotal)}</span>
                  </div>
                )}
              </div>
            ))}
          </div>

          {/* Configuración Jefe */}
          <section className="mt-8 mb-6 p-4 bg-zinc-900 rounded-2xl border border-zinc-800">
             <h3 className="text-xs font-black text-zinc-500 mb-4 uppercase tracking-widest">Configuración Destino</h3>
             <div className="flex items-center gap-3">
                <div className="bg-black p-3 rounded-xl flex-1 flex items-center gap-2 border border-zinc-800">
                  <span className="text-green-500 font-bold">+</span>
                  <input 
                    placeholder="WhatsApp Jefe (ej: 56912345678)"
                    value={whatsappJefe}
                    onChange={e => setWhatsappJefe(e.target.value)}
                    className="bg-transparent text-sm outline-none w-full"
                  />
                </div>
             </div>
          </section>

          {/* Footer Fijo con Totales */}
          <div className="fixed bottom-0 left-0 right-0 p-4 bg-[#0e0e10]/95 backdrop-blur-lg border-t border-zinc-800 z-40">
            <div className="max-w-2xl mx-auto flex items-center gap-4">
              <div className="flex-1">
                <p className="text-[10px] font-black text-zinc-500 uppercase">Total a Pagar</p>
                <h2 className="text-2xl font-black text-white leading-none">{formatearMoneda(totalPagar)}</h2>
                <p className="text-[10px] font-bold text-yellow-400 mt-1">{formatearNumero(totalKilos)} KG TOTALES</p>
              </div>
              <button 
                onClick={enviarWhatsApp}
                disabled={totalPagar === 0}
                className="bg-green-500 hover:bg-green-400 disabled:bg-zinc-800 text-black px-6 py-3 rounded-2xl font-black text-sm transition flex items-center gap-2 shadow-xl shadow-green-500/10 disabled:shadow-none"
              >
                REPORTE AL JEFE
              </button>
            </div>
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);

    // Inicializar iconos después del render
    setTimeout(() => {
      if (window.lucide) window.lucide.createIcons();
    }, 500);
  </script>
</body>
</html>
